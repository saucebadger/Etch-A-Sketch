<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etch-A-Sketch</title>
  <script src="sketch.js" defer></script>
  <link rel="stylesheet" href="sketch.css">
</head>
<body>
<div id="title">
    <h1>Etch-A-Sketch</h1>
    <button id="clear">Clear Grid</button>
</div>

<div id ="container">
 <div id ="colorpicker">
    <h3>🔧Tools🔧</h3>
    <div id = "colorbox">
    <input type="color" id="pen-color"> <p>🖍️Click Me To Change Color!</p>
    </div>
    <div id="gridgen">
    <input type ="number" id="grid-size" min="16" max="100">
    <button id ="userinput">Generate Grid</button>
    </div>

    <p>✏️Left-Click: Paint.Also works while dragging</p>
    <p>🧽Right-Click: Erase</p>
    </div>
<div id="content">
    
</div>   
</div>










</body>
</html>
